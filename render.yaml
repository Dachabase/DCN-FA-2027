services:
  - type: web
    name: ui-freshers-companion
    runtime: node
    plan: starter
    region: frankfurt # Low latency to AWS Stockholm (eu-north-1)
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_COMPUTING_BOT_TOKEN
        sync: false
      - key: DEFAULT_TELEGRAM_BOT_USERNAME
        value: UIDCNComputingFreshersBot
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
