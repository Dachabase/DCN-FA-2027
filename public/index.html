<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
<style type="text/tailwindcss">

@font-face {
  font-family: "Inter:Extra Bold";
  font-style: normal;
  font-weight: 800;
  src: url("https://static.figma.com/font/Inter_1") format("woff2");
}

html,
body,
#root {
  height: 100%;
}

body {
  font-family: 'Outfit', sans-serif;
}

h1, h2, h3, h4, h5, h6 {
  font-family: 'Plus Jakarta Sans', sans-serif;
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-12px); }
}
@keyframes float2 {
  0%, 100% { transform: translateY(0px) rotate(-2deg); }
  50% { transform: translateY(-8px) rotate(2deg); }
}
@keyframes float3 {
  0%, 100% { transform: translateY(0px) rotate(1deg); }
  50% { transform: translateY(-10px) rotate(-1deg); }
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(34,197,94,0.6); }
  50% { opacity: 0.7; transform: scale(0.85); box-shadow: 0 0 0 4px rgba(34,197,94,0); }
}
@keyframes shimmer {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}
@keyframes spin-slow {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes accordion-open {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes spring-pop {
  0% { transform: scale(1); }
  40% { transform: scale(1.25); }
  70% { transform: scale(0.9); }
  100% { transform: scale(1); }
}
@keyframes slide-right {
  from { transform: translateX(-6px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes fade-slide-up {
  from { opacity: 0; transform: translateY(22px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes ticker {
  0%, 100% { transform: translateY(0); }
  25%  { transform: translateY(-100%); }
  50%  { transform: translateY(-200%); }
  75%  { transform: translateY(-300%); }
}

.animate-fade-slide-up {
  animation: fade-slide-up 0.45s ease-out both;
}
.animate-fade-in {
  animation: fade-in 0.4s ease-out both;
}
@keyframes blob-morph {
  0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
  33% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
  66% { border-radius: 50% 40% 60% 30% / 40% 70% 30% 60%; }
}

.animate-float { animation: float 3s ease-in-out infinite; }
.animate-float-2 { animation: float2 4s ease-in-out infinite 0.5s; }
.animate-float-3 { animation: float3 3.5s ease-in-out infinite 1.2s; }
.animate-pulse-dot { animation: pulse-dot 1.5s ease-in-out infinite; }
.animate-spin-slow { animation: spin-slow 8s linear infinite; }
.animate-accordion { animation: accordion-open 0.25s ease-out; }
.animate-spring-pop { animation: spring-pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
.animate-blob { animation: blob-morph 8s ease-in-out infinite; }

/* Pencil writing animation */
@keyframes reveal-text {
  from { clip-path: inset(0 100% 0 0); }
  to   { clip-path: inset(0 0% 0 0); }
}
@keyframes pencil-move {
  from { left: 0px; opacity: 1; }
  to   { left: calc(100% - 32px); opacity: 1; }
}
@keyframes pencil-enter {
  from { opacity: 0; transform: scale(0.6) rotate(-20deg); }
  to   { opacity: 1; transform: scale(1) rotate(-20deg); }
}
@keyframes pencil-bob {
  0%, 100% { transform: rotate(-20deg) translateY(0px); }
  50%       { transform: rotate(-20deg) translateY(-2px); }
}
@keyframes cursor-blink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0; }
}
.animate-reveal-text {
  animation: reveal-text 2.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.animate-pencil-move {
  animation: pencil-enter 0.3s ease-out both, pencil-move 2.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.animate-pencil-bob {
  animation: pencil-bob 0.5s ease-in-out infinite;
  animation-delay: 2.8s;
}
.animate-cursor-blink {
  animation: cursor-blink 0.8s step-start infinite;
  animation-delay: 2.6s;
}

/* AI Mentor animations */
@keyframes wave-hand {
  0%   { transform: rotate(0deg); }
  10%  { transform: rotate(-18deg); }
  20%  { transform: rotate(20deg); }
  30%  { transform: rotate(-12deg); }
  40%  { transform: rotate(16deg); }
  50%  { transform: rotate(-6deg); }
  60%  { transform: rotate(10deg); }
  70%  { transform: rotate(-2deg); }
  80%  { transform: rotate(5deg); }
  90%, 100% { transform: rotate(0deg); }
}
@keyframes mentor-bob {
  0%, 100% { transform: translateY(0px) scale(1); }
  40%      { transform: translateY(-12px) scale(1.01); }
  60%      { transform: translateY(-10px) scale(1.01); }
}
@keyframes msg-arrive {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes typing-dot {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
  40%           { transform: translateY(-5px); opacity: 1; }
}
@keyframes send-dart {
  0%   { transform: translateX(0) translateY(0) scale(1); }
  50%  { transform: translateX(6px) translateY(-6px) scale(0.85); }
  100% { transform: translateX(0) translateY(0) scale(1); }
}
.animate-wave-hand { animation: wave-hand 2.8s ease-in-out infinite; animation-delay: 0.8s; }
.animate-mentor-bob { animation: mentor-bob 3.5s ease-in-out infinite; }
.animate-msg-arrive { animation: msg-arrive 0.18s ease-out both; }
.animate-send-dart  { animation: send-dart 0.35s ease-out; }

.shimmer-badge {
  background: linear-gradient(90deg, #830074 0%, #c87ebb 40%, #FF6B4A 60%, #830074 100%);
  background-size: 200% auto;
  animation: shimmer 3s linear infinite;
}

/* Onboarding animations */
@keyframes step-in {
  from { opacity: 0; transform: translateX(20px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes dot-complete {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.55); }
  70%  { transform: scale(0.88); }
  100% { transform: scale(1); }
}
@keyframes float-item-a {
  0%, 100% { transform: translateY(0px) rotate(-3deg); }
  50%      { transform: translateY(-10px) rotate(3deg); }
}
@keyframes float-item-b {
  0%, 100% { transform: translateY(0px) rotate(4deg); }
  50%      { transform: translateY(-8px) rotate(-4deg); }
}
@keyframes float-item-c {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  50%      { transform: translateY(-12px) rotate(6deg); }
}
@keyframes float-item-d {
  0%, 100% { transform: translateY(0px) rotate(-6deg); }
  50%      { transform: translateY(-7px) rotate(2deg); }
}
@keyframes glow-pulse {
  0%, 100% { opacity: 0.35; transform: scale(1); }
  50%      { opacity: 0.55; transform: scale(1.06); }
}
.animate-step-in    { animation: step-in 0.3s cubic-bezier(0.22, 1, 0.36, 1) both; }
.animate-dot-complete { animation: dot-complete 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
.animate-fia  { animation: float-item-a 3.4s ease-in-out infinite; }
.animate-fib  { animation: float-item-b 4.1s ease-in-out infinite 0.6s; }
.animate-fic  { animation: float-item-c 2.9s ease-in-out infinite 1.2s; }
.animate-fid  { animation: float-item-d 3.7s ease-in-out infinite 0.3s; }
.animate-glow { animation: glow-pulse 3.5s ease-in-out infinite; }

.focus-input:focus {
  border-color: #830074 !important;
  box-shadow: 0 0 0 3px rgba(131, 0, 116, 0.13) !important;
}

.scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
.scrollbar-hide::-webkit-scrollbar { display: none; }

.card-hover {
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.card-hover:hover {
  transform: translateY(-6px);
  box-shadow: 0 20px 48px rgba(131, 0, 116, 0.15);
}

.guide-img-wrap { overflow: hidden; }
.guide-img-wrap img {
  transition: transform 0.4s ease;
}
.guide-card:hover .guide-img-wrap img {
  transform: scale(1.05);
}

.arrow-link svg {
  transition: transform 0.2s ease;
}
.arrow-link:hover svg {
  transform: translateX(4px);
}

</style>
</head>

 assist me at your earliest convenience."},{key:"C",text:"Gonna need your help ASAP on this one, bro."},{key:"D",text:"Could ya maybe just help me out a bit later?"}],correct:"B",explanation:"Formal register uses complete sentences, polite phrasing, and avoids contractions or colloquial language. Option B exemplifies this through its complete sentence structure and respectful tone."},{id:4,text:'In reading comprehension, "inference" means:',options:[{key:"A",text:"Copying a sentence directly from the passage"},{key:"B",text:"Paraphrasing the passage in simpler words"},{key:"C",text:"Drawing a conclusion from evidence implied but not explicitly stated in the text"},{key:"D",text:"Identifying and restating the main idea of the passage"}],correct:"C",explanation:'An inference is a logical conclusion drawn from clues or evidence within the text, rather than from information the author states outright. It requires the reader to "read between the lines."'},{id:5,text:'Which punctuation mark is correctly used in: "She bought milk, bread, eggs, and butter."?',options:[{key:"A",text:"Semicolon \u2014 used to join independent clauses"},{key:"B",text:"Colon \u2014 used to introduce a list or explanation"},{key:"C",text:'Oxford comma (serial comma) \u2014 the comma before "and" in a list'},{key:"D",text:"Em dash \u2014 used to add emphasis or an aside"}],correct:"C",explanation:'The comma placed before "and" in a series of three or more items is called the Oxford comma or serial comma. It prevents ambiguity and is widely recommended in academic and formal writing.'}]},{code:"GST 112",title:"Philosophy & Logic",emoji:"\u{1F9E0}",description:"Practice real past exam questions under actual timed conditions. Immediate score breakdown and step-by-step answer explanations provided upon completion.",duration:10,color:Gr,questions:[{id:1,text:"Which branch of philosophy is primarily concerned with the nature of knowledge?",options:[{key:"A",text:"Ethics \u2014 the study of moral principles and right action"},{key:"B",text:"Metaphysics \u2014 the study of fundamental reality"},{key:"C",text:"Epistemology \u2014 the study of knowledge and justified belief"},{key:"D",text:"Aesthetics \u2014 the study of beauty and art"}],correct:"C",explanation:'Epistemology (from the Greek "episteme" \u2014 knowledge) is the branch of philosophy that investigates the nature, origins, scope, and limits of human knowledge and justified belief.'},{id:2,text:"A valid deductive argument is one in which:",options:[{key:"A",text:"All of the premises are known to be true"},{key:"B",text:"The conclusion follows necessarily from the premises, if the premises are true"},{key:"C",text:"The conclusion is supported by strong empirical evidence"},{key:"D",text:"Both the premises and the conclusion are obviously correct"}],correct:"B",explanation:"In deductive logic, validity concerns the argument's structure, not the truth of its content. An argument is valid if the conclusion must follow from the premises \u2014 even if the premises are false in reality."},{id:3,text:"The philosophical position that the mind and body are two fundamentally distinct substances is called:",options:[{key:"A",text:"Monism \u2014 all reality is one substance"},{key:"B",text:"Dualism \u2014 reality consists of mind and matter as separate substances"},{key:"C",text:"Materialism \u2014 only physical matter exists"},{key:"D",text:"Idealism \u2014 only minds and mental states are real"}],correct:"B",explanation:"Dualism, most famously articulated by Ren\xE9 Descartes, holds that reality consists of two fundamentally distinct substances: the thinking mind (res cogitans) and the extended body (res extensa)."},{id:4,text:'An "ad hominem" fallacy occurs when someone:',options:[{key:"A",text:"Uses circular reasoning, restating the conclusion as a premise"},{key:"B",text:"Attacks an opponent's character instead of addressing the argument's content"},{key:"C",text:"Assumes event A caused event B merely because A What would you like to know today?`,vy={"How do I calculate 1st semester GPA on 5.0 scale?":`Great question! At UI, your GPA runs on a 5-point scale. Here's the formula:

**Grade Points:**
\u2022 A (70\u2013100%) = 5.0
\u2022 B (60\u201369%) = 4.0
\u2022 C (50\u201359%) = 3.0
\u2022 D (45\u201349%) = 2.0
\u2022 E (40\u201344%) = 1.0
\u2022 F (0\u201339%) = 0.0

**Step 1:** Multiply each course's grade point \xD7 its credit units.
**Step 2:** Add all results together.
**Step 3:** Divide by total credit units registered.

**Example:** B (4.0) in a 3-unit course + A (5.0) in a 2-unit course:
GPA = (12 + 10) \xF7 5 = **4.4 / 5.0**

Target 4.5+ for First Class Honours! You can use the GST CBT Simulator on this platform to practice exam questions too.`,"What are the required documents for 100L clearance?":`For UI 100-Level clearance you'll need these documents ready:

**Core Documents:**
1. JAMB admission letter (original + 2 photocopies)
2. O'Level result \u2014 WAEC/NECO/NABTEB (original + 2 photocopies)
3. Birth certificate or sworn age declaration
4. Local Government Identification Letter
5. 4 passport photographs (white background)
6. Acceptance fee receipt
7. School fees payment receipt

**Medical Clearance (Jaja Clinic, UI):**
\u2022 Completed medical examination form
\u2022 Valid immunisation/vaccination records

**Pro Tips:**
\u2022 Make at least 4 copies of every document before you arrive
\u2022 Clearance happens in stages: Faculty \u2192 Medical \u2192 Dean of Students \u2192 Bursary
\u2022 Start in Week 1 \u2014 queues grow longer each day
\u2022 Some faculties (Law, Medicine) require extra documents \u2014 confirm with your faculty office!`,"Explain GST 111 syllabus & exam tips":`**GST 111 \u2014 Communication in English** (2 credit units, compulsory for all 100-Level students).

**Key Syllabus Topics:**
\u2022 Reading Comprehension & Vocabulary Building
\u2022 Essay Writing: expository, narrative, argumentative, descriptive
\u2022 Formal vs. Informal Register
\u2022 Sentence Structure, Grammar & Punctuation
\u2022 Paragraph Development & Thesis Statements
\u2022 Oral Communication & Listening Skills
\u2022 Academic Referencing & Citation

**Exam Format:**
\u2022 CBT \u2014 typically 50\u201360 multiple choice questions
\u2022 Duration: 45\u201360 minutes
\u2022 Heavy focus on comprehension passages and grammar

**Top Exam Tips:**
1. Practice reading long passages quickly \u2014 comprehension is ~40% of marks
2. Know formal vs. informal register examples cold
3. Master comma usage, Oxford comma, and thesis statement structure
4. Use the **GST CBT Simulator** on this platform to rehearse under real timed conditions!

Want me to quiz you on a specific topic? `,"How to apply for UI hostel bed space":`UI hostel allocation is competitive \u2014 apply early! Here's how:

**Application Steps:**
1. Log in to the **UI Student Portal** (portal.ui.edu.ng)
2. Go to Student Services \u2192 "Hostel Allocation"
3. Complete the online application (personal info, next of kin, health details)
4. Pay the hostel fee online (\u20A615,000\u2013\u20A650,000+ depending on hall type)
5. Check your allocation result on the portal after the deadline

**Available Halls:**
\u2022 **Female:** Queen Idia, Kuti, Obafemi Awolowo, Nnamdi Azikiwe Halls
\u2022 **Male:** Mellanby, Sultan Bello, Tedder, Independence Halls

**Critical Tips:**
\u2022 Apply the moment the portal opens \u2014 spots fill within hours
\u2022 Not all freshers get hostel \u2014 prepare an off-campus backup
\u2022 Popular off-campus areas: Agbowo, Sango, Ajibode (10\u201315 min from campus)
\u2022 Allocated halls are non-transferable between students

Would you like tips on off-campus housing near UI? `,"What scholarships are available for freshers?":`Several funding opportunities are open specifically for UI 100-Level students!

**University Opportunities:**
\u2022 **UI Merit Scholarship** \u2014 \u20A6250,000/session (post-UTME score \u2265 280)
\u2022 **UI Work-Study Scheme** \u2014 \u20A645,000/month (library & faculty assistantships)

**External Awards:**
\u2022 **Nigerian ETF Excellence Award** \u2014 \u20A6180,000/session (UTME \u2265 260)
\u2022 **Google Generation Scholarship** \u2014 $1,000 USD + mentorship (STEM freshers)
\u2022 **DCN Innovation Fellowship** \u2014 Mentorship + cloud credits + developer swag

**Upcoming Deadlines:**
\u2022 UI Merit Scholarship: October 30, 2026
\u2022 ETF Excellence Award: November 15, 2026
\u2022 Google Generation: December 1, 2026

Visit the **Grants page** on this platform for full details, eligibility requirements, and direct application links!

Would you like help preparing a strong scholarship application? `,"What is the credit unit system at UI?":`The **credit unit system** at UI determines your course load and CGPA. Here's how it works:

**What Are Credit Units?**
Each course is assigned a weight in "credit units" (usually 1\u20134). A 3-unit course carries three times the GPA weight of a 1-unit course.

**Minimum & Maximum Load:**
\u2022 Most 100-Level students register **15\u201324 credit units** per semester
\u2022 The Dean's approval is required to go below 15 or above 24
\u2022 Your faculty prescribes mandatory courses \u2014 check your handbook

**Why It Matters:**
\u2022 Your GPA = Total Grade Points \xF7 Total Credit Units (not just the number of courses)
\u2022 A bad grade in a 4-unit course hurts your CGPA much more than in a 1-unit course
\u2022 Prioritise high-credit-unit courses in your study time allocation

**Pro Strategy:**
\u2022 Don't overload in 1st semester \u2014 settle in, then push harder in 2nd semester
\u2022 Always verify your registered courses on the portal before the semester closes
